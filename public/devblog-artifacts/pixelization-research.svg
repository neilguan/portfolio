<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Research-guided pixelization diagram</title>
  <desc id="desc">A three-stage conversion from source image to quantized pixels to silhouette review, with the missing feedback loop highlighted.</desc>
  <rect width="720" height="360" fill="#172129"/>
  <g font-family="monospace" fill="#f3f0e8">
    <text x="42" y="54" font-size="16" fill="#86b9aa">PIXEL TEST / 03</text>
    <rect x="42" y="108" width="170" height="86" fill="#24353a" stroke="#86b9aa"/><text x="64" y="143" font-size="16">source</text><text x="64" y="170" font-size="13" fill="#c4d3cf">material + shape</text>
    <path d="M212 151h42" stroke="#86b9aa" stroke-width="2"/><path d="m240 141 14 10-14 10" fill="none" stroke="#86b9aa" stroke-width="2"/>
    <rect x="254" y="108" width="190" height="86" fill="#24353a" stroke="#86b9aa"/><text x="276" y="143" font-size="16">quantize</text><text x="276" y="170" font-size="13" fill="#c4d3cf">palette + resolution</text>
    <path d="M444 151h42" stroke="#86b9aa" stroke-width="2"/><path d="m472 141 14 10-14 10" fill="none" stroke="#86b9aa" stroke-width="2"/>
    <rect x="486" y="108" width="192" height="86" fill="#3a2b2a" stroke="#c9785f"/><text x="508" y="143" font-size="16" fill="#f0b09b">review?</text><text x="508" y="170" font-size="13" fill="#e3c5bd">not enough feedback</text>
    <text x="42" y="258" font-size="15" fill="#c4d3cf">The paper clarified the operation.</text><text x="42" y="288" font-size="17">It did not make the damaged pixel obvious.</text>
  </g>
</svg>
