<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Compiled Aseprite workspace diagram</title>
  <desc id="desc">A simplified Aseprite workspace showing canvas, layers, palette, and frame inspection.</desc>
  <rect width="720" height="360" fill="#172129"/>
  <g font-family="monospace" fill="#f3f0e8">
    <text x="42" y="50" font-size="16" fill="#86b9aa">PIXEL ROUTE / 05</text>
    <rect x="42" y="80" width="442" height="224" fill="#24353a" stroke="#86b9aa"/><rect x="66" y="112" width="300" height="158" fill="#c4d3cf"/>
    <g shape-rendering="crispEdges" fill="#66896f"><rect x="156" y="142" width="100" height="22"/><rect x="126" y="164" width="160" height="66"/><rect x="156" y="230" width="25" height="20"/><rect x="230" y="230" width="25" height="20"/></g>
    <rect x="386" y="112" width="74" height="158" fill="#172129"/><text x="396" y="136" font-size="11">layers</text><text x="396" y="162" font-size="11" fill="#86b9aa">body</text><text x="396" y="184" font-size="11">face</text><text x="396" y="206" font-size="11">shadow</text>
    <rect x="502" y="80" width="176" height="224" fill="#24353a" stroke="#86b9aa"/><text x="524" y="118" font-size="15">inspect</text><text x="524" y="154" font-size="13" fill="#c4d3cf">palette</text><text x="524" y="180" font-size="13" fill="#c4d3cf">frames</text><text x="524" y="206" font-size="13" fill="#c4d3cf">pixel edges</text><text x="524" y="232" font-size="13" fill="#c4d3cf">export</text>
  </g>
</svg>
