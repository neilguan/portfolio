<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Audio revision loop diagram</title>
  <desc id="desc">An isolated audio revision loop showing chirp, quiet gaps, and a clean ambience layer.</desc>
  <rect width="720" height="360" fill="#172129"/>
  <g font-family="monospace" fill="#f3f0e8">
    <text x="42" y="54" font-size="16" fill="#86b9aa">AUDIO REVISION / 05</text>
    <rect x="42" y="112" width="158" height="76" fill="#24353a" stroke="#86b9aa"/><text x="64" y="146" font-size="16">isolated chirp</text><text x="64" y="169" font-size="12" fill="#c4d3cf">one idea at a time</text>
    <path d="M200 150h38" stroke="#86b9aa" stroke-width="2"/><path d="m226 140 14 10-14 10" fill="none" stroke="#86b9aa" stroke-width="2"/>
    <rect x="240" y="112" width="164" height="76" fill="#24353a" stroke="#86b9aa"/><text x="262" y="146" font-size="16">quiet gaps</text><text x="262" y="169" font-size="12" fill="#c4d3cf">make space</text>
    <path d="M404 150h38" stroke="#86b9aa" stroke-width="2"/><path d="m430 140 14 10-14 10" fill="none" stroke="#86b9aa" stroke-width="2"/>
    <rect x="444" y="112" width="218" height="76" fill="#24353a" stroke="#86b9aa"/><text x="466" y="146" font-size="16">ambience layer</text><text x="466" y="169" font-size="12" fill="#c4d3cf">wind stays separate</text>
    <text x="42" y="248" font-size="15" fill="#c4d3cf">Failure diagnosis:</text><text x="42" y="278" font-size="17">density · synthetic texture · no room to breathe</text>
  </g>
</svg>
